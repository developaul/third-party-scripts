name: Labeler

on: [pull_request]

permissions:
  pull-requests: write
  issues: write

jobs:
  labeler:
    runs-on: ubuntu-latest
    name: Label the PR
    steps: 
      - name: Pull request size labeler
        uses: developaul/pr-size-labeler@main
        with: 
          github_token: ${{ secrets.GITHUB_TOKEN }}
          xs_max_size: "1"
          s_max_size: "2"
          m_max_size: "3"
          l_max_size: "4"
          fail_if_xl: "true"
